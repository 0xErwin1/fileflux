name: Nightly

# Rolling nightly build of the Linux `fileflux` package, like ReqFlux's and
# DBFlux's: one prerelease under the single tag `nightly`, replaced by every
# new build. It runs once a day and skips when main has not advanced since the
# commit the `nightly` tag points at, so the tag count never grows and an idle
# main publishes nothing. A manual dispatch always builds. The build only runs
# when CI succeeded on the exact commit being built (checked in the guard). Fileflux is
# Linux-only (inotify, lsblk, gvfs), so there is no macOS build.

on:
  schedule:
    # 03:17 UTC daily: a low-traffic window, off the top of the hour.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    name: Guard - canonical repo and new commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # `gh run list` reads the CI runs of this commit.
      actions: read
    outputs:
      # The CI step only runs when the guard decided to build, and then has
      # the last word; otherwise the guard's own answer stands.
      proceed: ${{ steps.ci.outputs.proceed || steps.guard.outputs.proceed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Decide whether to build
        id: guard
        env:
          REPOSITORY: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          # Only the canonical repository runs the schedule; forks do not.
          if [ "$REPOSITORY" != "0xErwin1/fileflux" ]; then
            echo "Skipping nightly: not the canonical repository."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The single tag tracks main: a run from any other ref never moves it.
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::The nightly only builds main, not $REF."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # A manual run always builds, even with no new commits.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Manual dispatch: building regardless of new commits."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The `nightly` tag points at a pin commit (nix/nightly-info.nix with
          # the real hash) whose first parent is the main commit the last
          # nightly was built from. Skip when main has not advanced since then.
          CURRENT="$(git rev-parse HEAD)"
          if ! LAST="$(git rev-parse --verify --quiet 'nightly^')"; then
            echo "No previous nightly tag: building."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$LAST" = "$CURRENT" ]; then
            echo "No new commits on main since the last nightly ($LAST): skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Prose and designs do not reach the binary, so a range made only of
          # them would publish the same build again. The tag stays put, so the
          # next nightly's changes still cover those commits. A failed diff
          # builds: a broken check costs a build rather than a missed nightly.
          if ! changed="$(git diff --name-only "$LAST" "$CURRENT")"; then
            echo "::warning::cannot diff $LAST..$CURRENT; building"
          elif ! printf '%s\n' "$changed" | grep -qvE '(\.md$|^design/|^docs/)'; then
            echo "main advanced $LAST -> $CURRENT with prose and design changes only: skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "main advanced $LAST -> $CURRENT: building."
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      # Never publish a binary for a commit that CI has not passed. This is a
      # lookup rather than a `workflow_run` trigger: it keeps the schedule and
      # manual dispatch, and works on the exact commit being built. A commit
      # whose CI is still running or has not run is skipped on the schedule
      # (the next run retries) and is an error on a manual dispatch.
      - name: Require a successful CI run for this commit
        id: ci
        if: steps.guard.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          PASSED=$(gh run list --workflow ci.yml --commit "$SHA" --event push \
            --status success --json databaseId --jq 'length')
          if [ "$PASSED" -gt 0 ]; then
            echo "CI passed for $SHA."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "proceed=false" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "::error::No successful CI run for $SHA; wait for CI to pass, then dispatch again."
            exit 1
          fi
          # Tell "not finished or not queued yet" apart from "finished without
          # success", so a red CI on main does not look like a nightly that
          # will catch up. A failed lookup is reported as unknown, never as a
          # CI verdict.
          RUNS=$(gh run list --workflow ci.yml --commit "$SHA" --event push \
            --json status,conclusion \
            --jq '[length, ([.[] | select(.status != "completed")] | length)] | @tsv' \
            ) || RUNS="unknown"
          if [ "$RUNS" = "unknown" ]; then
            echo "::warning::Could not query CI runs for $SHA: skipping; the next scheduled run retries."
          elif [ "$(cut -f1 <<<"$RUNS")" -eq 0 ] || [ "$(cut -f2 <<<"$RUNS")" -gt 0 ]; then
            echo "::warning::CI has not finished (or not started) for $SHA: skipping; the next scheduled run retries."
          else
            echo "::error::CI finished without success for $SHA: the nightly is skipped until a commit with passing CI lands on main."
            exit 1
          fi

  compute-version:
    name: Compute nightly version
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.nightly.outputs.version }}
      short_sha: ${{ steps.nightly.outputs.short_sha }}
      date: ${{ steps.nightly.outputs.date }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Compute version string
        id: nightly
        run: |
          # The nightly version is the package version with its pre-release
          # suffix stripped (0.1.0-dev.0 -> 0.1.0) plus the short commit as
          # semver build metadata, which does not affect semver ordering.
          MATCHES=$(grep -c '^version = "' Cargo.toml)
          if [ "$MATCHES" -ne 1 ]; then
            echo "::error::Expected exactly 1 package version line in Cargo.toml, found $MATCHES."
            exit 1
          fi
          BASE=$(grep '^version = "' Cargo.toml | sed 's/.*= *"\(.*\)"/\1/' | sed 's/-[^+]*//')
          SHORT_SHA=$(git rev-parse --short HEAD)
          NIGHTLY_VERSION="${BASE}-nightly+${SHORT_SHA}"
          {
            echo "version=${NIGHTLY_VERSION}"
            echo "short_sha=${SHORT_SHA}"
            echo "date=$(date -u '+%Y-%m-%d')"
          } >> "$GITHUB_OUTPUT"
          echo "Nightly version: ${NIGHTLY_VERSION}"

  build:
    name: Build Linux
    needs: compute-version
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch, toolchain pinned below
        with:
          toolchain: 1.99.1

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mold pkg-config libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libvulkan-dev libx11-xcb-dev libxcb1-dev libfreetype-dev \
            libfontconfig-dev libssl-dev libzstd-dev libasound2-dev

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          # The scheduled run is on main; a cache saved on a tag ref can never
          # be read back (same rationale as DBFlux's build).
          save-if: github.ref == 'refs/heads/main'

      - name: Stamp package version
        env:
          VERSION: ${{ needs.compute-version.outputs.version }}
        run: |
          # Same single-line guard as compute-version. VERSION is read from
          # env, not interpolated into the script, so crafted input cannot
          # inject shell. The stamp rewrites the package version in both
          # Cargo.toml and Cargo.lock, so the build below can stay --locked:
          # no dependency is ever re-resolved.
          MATCHES=$(grep -c '^version = "' Cargo.toml)
          if [ "$MATCHES" -ne 1 ]; then
            echo "::error::Expected exactly 1 package version line in Cargo.toml, found $MATCHES."
            exit 1
          fi
          sed -i "s|^version = \".*\"|version = \"${VERSION}\"|" Cargo.toml
          grep -qF "version = \"${VERSION}\"" Cargo.toml \
            || { echo "::error::Version stamp did not apply."; exit 1; }
          sed -i '/^name = "fileflux"$/{n;s|^version = ".*"|version = "'"${VERSION}"'"|}' Cargo.lock
          grep -A1 '^name = "fileflux"$' Cargo.lock | grep -qF "version = \"${VERSION}\"" \
            || { echo "::error::Lockfile version stamp did not apply."; exit 1; }
          # Only that one line may differ from the committed lockfile.
          CHANGED=$(git diff --numstat Cargo.lock | cut -f1,2)
          if [ -n "$CHANGED" ] && [ "$CHANGED" != "$(printf '1\t1')" ]; then
            echo "::error::Lockfile stamp changed more than the package version."
            exit 1
          fi

      - name: Build Fileflux
        run: cargo build --release --locked

      - name: Assemble the package
        run: |
          mkdir -p pkg/bin pkg/packaging pkg/share/applications pkg/share/icons/hicolor/scalable/apps
          for size in 16 32 48 64 128 256; do
            mkdir -p "pkg/share/icons/hicolor/${size}x${size}/apps"
          done
          cp target/release/fileflux pkg/bin/fileflux
          cp target/release/fileflux-owner-helper pkg/bin/fileflux-owner-helper
          cp packaging/dev.fileflux.owner-helper.policy pkg/packaging/dev.fileflux.owner-helper.policy
          cp packaging/dev.fileflux.open-as-admin.policy pkg/packaging/dev.fileflux.open-as-admin.policy
          cp packaging/fileflux.desktop pkg/share/applications/fileflux.desktop
          cp assets/icon/fileflux.svg pkg/share/icons/hicolor/scalable/apps/fileflux.svg
          cp assets/icon/fileflux-16.png pkg/share/icons/hicolor/16x16/apps/fileflux.png
          cp assets/icon/fileflux-32.png pkg/share/icons/hicolor/32x32/apps/fileflux.png
          cp assets/icon/fileflux-48.png pkg/share/icons/hicolor/48x48/apps/fileflux.png
          cp assets/icon/fileflux-64.png pkg/share/icons/hicolor/64x64/apps/fileflux.png
          cp assets/icon/fileflux-128.png pkg/share/icons/hicolor/128x128/apps/fileflux.png
          cp assets/icon/fileflux-256.png pkg/share/icons/hicolor/256x256/apps/fileflux.png
          cp LICENSE pkg/LICENSE

      # One tarball, published under two names: the rolling name for humans
      # (replaced by every build) and a per-build immutable name that
      # nix/nightly-info.nix pins, so a pinned URL and its hash never drift.
      - name: Create tar archive
        env:
          BUILD_NAME: fileflux-linux-amd64-${{ needs.compute-version.outputs.date }}-${{ needs.compute-version.outputs.short_sha }}
        run: |
          cd pkg
          tar -czf "../${BUILD_NAME}.tar.gz" .
          cd ..
          cp "${BUILD_NAME}.tar.gz" fileflux-linux-amd64.tar.gz

      - name: Generate checksums
        env:
          BUILD_NAME: fileflux-linux-amd64-${{ needs.compute-version.outputs.date }}-${{ needs.compute-version.outputs.short_sha }}
        run: |
          sha256sum "${BUILD_NAME}.tar.gz" > "${BUILD_NAME}.tar.gz.sha256"
          sha256sum fileflux-linux-amd64.tar.gz > fileflux-linux-amd64.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: |
            fileflux-linux-amd64.tar.gz
            fileflux-linux-amd64.tar.gz.sha256
            fileflux-linux-amd64-*.tar.gz
            fileflux-linux-amd64-*.tar.gz.sha256
          retention-days: 90

  release:
    name: Publish rolling nightly release
    # Every platform must build before the release publishes: a failed build
    # leaves the tag and the previous assets in place.
    needs: [compute-version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # The previous `nightly` tag scopes the list of changes.
          fetch-depth: 0
          fetch-tags: true

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-amd64
          path: artifacts

      - name: Compose nightly release body
        env:
          SHORT_SHA: ${{ needs.compute-version.outputs.short_sha }}
          DATE: ${{ needs.compute-version.outputs.date }}
        run: |
          cat > release_body.md <<EOF
          > **Nightly build**: built automatically from \`main\` once a day when it has new
          > commits. Not recommended for production use. Each build replaces the previous one
          > under the same \`nightly\` tag.
          >
          > Commit: \`${SHORT_SHA}\` - ${DATE}

          EOF
          # The tag still points at the previous pin commit here, and its
          # first parent is the main commit that build came from, so
          # nightly^..HEAD is what changed on main since then.
          if git rev-parse --verify --quiet 'nightly^' >/dev/null; then
            CHANGES=$(git log --no-merges --format='- %s (%h)' 'nightly^..HEAD')
          else
            CHANGES=$(git log --no-merges --format='- %s (%h)' -n 30 HEAD)
          fi
          if [ -n "$CHANGES" ]; then
            {
              echo "## Changes since the previous nightly"
              echo ""
              echo "$CHANGES"
            } >> release_body.md
          fi

      - name: Publish nightly release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: nightly
          name: Fileflux Nightly
          body_path: release_body.md
          prerelease: true
          # Rolling names are replaced one file at a time (the action deletes
          # that one asset, then uploads its replacement), so a failure mid-step
          # can leave a single rolling asset missing until the next run; the
          # per-build assets that Nix pins are new names and are never
          # replaced. Per-build assets accumulate and are pruned in the last
          # step.
          overwrite_files: true
          files: |
            artifacts/fileflux-linux-amd64*.tar.gz
            artifacts/fileflux-linux-amd64*.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Last, so the tag only moves once the build is published: if anything
      # above fails, the tag still points at the previous nightly, the guard
      # sees new commits and the next scheduled run retries.
      #
      # The tag points at a pin commit on top of this build's main commit
      # that rewrites nix/nightly-info.nix with the published tarball's hash,
      # so `github:0xErwin1/fileflux/nightly#fileflux-nightly` fetches it. The
      # pin commit is never pushed to main; pushing the tag carries it.
      - name: Pin nix/nightly-info.nix and move the nightly tag
        env:
          NIGHTLY_VERSION: ${{ needs.compute-version.outputs.version }}
          BUILD_NAME: fileflux-linux-amd64-${{ needs.compute-version.outputs.date }}-${{ needs.compute-version.outputs.short_sha }}
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short HEAD)

          # SRI hash of the per-build tarball, without requiring nix.
          HASH_AMD64="sha256-$(openssl dgst -sha256 -binary \
            "artifacts/${BUILD_NAME}.tar.gz" | base64 -w0)"

          cat > nix/nightly-info.nix <<NIX_EOF
          # Rolling nightly channel pointer, auto-generated by .github/workflows/nightly.yml.
          #
          # This file lives on the \`nightly\` git ref. The URL names this build's
          # immutable per-build asset, so the hash and version below always match
          # it, even after later nightlies replace the rolling tarball.
          # On \`main\` it only holds a placeholder: always consume via the
          # \`nightly\` ref:
          #
          #   nix run github:0xErwin1/fileflux/nightly#fileflux-nightly
          #
          # From-source nightly (no hash needed):
          #
          #   nix run github:0xErwin1/fileflux/nightly#fileflux-source
          {
            version = "${NIGHTLY_VERSION}";

            artifacts = {
              "x86_64-linux" = {
                url = "https://github.com/0xErwin1/fileflux/releases/download/nightly/${BUILD_NAME}.tar.gz";
                hash = "${HASH_AMD64}";
              };
            };
          }
          NIX_EOF

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add nix/nightly-info.nix
          git commit -m "chore(nightly): pin nix/nightly-info.nix ${SHORT_SHA}"

          git tag -f nightly HEAD
          git push origin refs/tags/nightly --force

      # After the new pin is on the remote: keep the most recent KEEP_BUILDS
      # per-build assets (by upload time) and drop older ones. Retention is by
      # count, not by the date in the name, so a nightly superseded after a
      # long idle period on main still stays fetchable for the next
      # KEEP_BUILDS builds. The current build is never deleted, and a failure
      # here leaves extra assets rather than a broken nightly.
      - name: Prune old per-build assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_NAME: fileflux-linux-amd64-${{ needs.compute-version.outputs.date }}-${{ needs.compute-version.outputs.short_sha }}
          KEEP_BUILDS: '14'
        run: |
          set -euo pipefail
          RELEASE_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/nightly")
          # Per-build stems (name without .sha256), newest upload first.
          mapfile -t KEEP < <(
            jq -r '.assets | sort_by(.created_at) | reverse | .[].name' <<<"$RELEASE_JSON" |
            grep -E '^fileflux-linux-amd64-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9a-f]+\.tar\.gz$' |
            head -n "$KEEP_BUILDS"
          )
          KEEP+=("${BUILD_NAME}.tar.gz")
          jq -r '.assets[] | "\(.id) \(.name)"' <<<"$RELEASE_JSON" |
          while read -r ID NAME; do
            # Only per-build names (…-YYYY-MM-DD-<sha>.tar.gz[.sha256]); the
            # rolling names and anything else are left alone.
            [[ "$NAME" =~ ^fileflux-linux-amd64-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9a-f]+\.tar\.gz(\.sha256)?$ ]] || continue
            STEM="${NAME%.sha256}"
            KEPT=false
            for K in "${KEEP[@]}"; do [[ "$STEM" == "$K" ]] && KEPT=true && break; done
            if [[ "$KEPT" == false ]]; then
              echo "Deleting $NAME (beyond the newest ${KEEP_BUILDS} builds)"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${ID}"
            fi
          done
