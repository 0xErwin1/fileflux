[package]
name = "fileflux"
version = "0.1.0-dev.0"
edition = "2024"
rust-version = "1.99"
description = "A file explorer in the Bolt family"
license = "Apache-2.0"
publish = false

[dependencies]
# The GPUI stack follows DBFlux, like ReqFlux: gpui-pre 0.3.9 and
# gpui-component / gpui-kit-assets 0.7.3, with DBFlux's patched copies taken by
# git rev (see [patch.crates-io]) so the app, bolt and gpui-component build
# against one GPUI.
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui-component = { version = "=0.7.3" }
# The Lucide icon catalog gpui-component 0.7.3 bundles, the one the family
# links; the window draws its icons through `bolt`'s `IconSource::Svg`.
gpui-kit-assets = { version = "=0.7.3" }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.9", default-features = false, features = ["font-kit", "wayland", "x11"] }

# Bolt, the design system shared with DBFlux and ReqFlux, from the same DBFlux
# rev as the GPUI stack.
bolt = { git = "https://github.com/0xErwin1/dbflux", rev = "91192cb1966e5af4a6022094cb73b7e6b62d386b" }

# The GPUI automation bridge (dev-only, behind the `ui-automation` feature).
gpui-mcp = { git = "https://github.com/0xErwin1/dbflux", rev = "91192cb1966e5af4a6022094cb73b7e6b62d386b", default-features = false, features = ["gpui-pre"], optional = true }

# Only what startup and logging need.
anyhow = "1.0.104"
env_logger = "0.11.11"
log = "0.4.34"

# Already in the lock through the GPUI stack; taken directly for the refined
# shell: volume usage (safe statvfs), local/relative modified dates, and
# blocking inotify waits for live refresh.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
rustix = { version = "1.1.6", features = ["event", "fs"] }
# The viewer rotates decoded pixels with `imageops` and hands them to GPUI as
# a frame; the thumbnail generator decodes the formats the grid lists (jpeg,
# png, webp, gif, bmp) to downscale them. The version is the one GPUI already
# links, so both share one `image::Frame` type, and these codecs are already
# compiled through GPUI.
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
# Settings persistence: the TOML files under the XDG config and state
# directories. Both versions are already in the lock through the GPUI stack;
# only the features the files need are enabled.
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
toml = { version = "=1.2.1", default-features = false, features = ["std", "serde", "parse", "display"] }
# The `lsblk -J` reader; the version is the one already in the lock through the GPUI stack.
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }
# The recent-files list and the thumbnail cache read desktop-standard files
# with crates the lock already holds through the GPUI stack, at the locked
# versions: quick-xml for `recently-used.xbel`, md-5 for the thumbnail file
# name (the md5 of the file's URI) and png for the `tEXt` chunks that tie a
# thumbnail to its source.
quick-xml = { version = "=0.41.0", default-features = false }
md-5 = { version = "=0.10.6", default-features = false }
png = { version = "=0.18.1", default-features = false }
# The SVG rasterizer the GPUI stack already links (gpui-pre renders its own
# SVGs with it), taken directly only to rasterize themed icons in colour;
# the `=` pins reuse the exact builds already in the lock, so no new crates
# compile.
resvg = { version = "=0.46.0" }
usvg = { version = "=0.46.0" }

[features]
default = []
ui-automation = ["dep:gpui-mcp"]

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unwrap_in_result = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
indexing_slicing = "warn"
let_underscore_must_use = "warn"

# Fileflux follows DBFlux's GPUI stack by git rev: DBFlux vendors gpui-pre 0.3.9
# with the frame-observer hooks, gpui-base and gpui-component 0.7.3 with its
# editor patches, and gpui-pre-linux 0.3.9 with a Wayland keymap fix (see
# vendor/*/VENDOR.md there). Taking them by git keeps the app, bolt and
# gpui-component on one GPUI build without copying them here. The rev is
# DBFlux's main where Bolt was merged (#1233); move it with DBFlux.
[patch.crates-io]
gpui-pre = { git = "https://github.com/0xErwin1/dbflux", rev = "91192cb1966e5af4a6022094cb73b7e6b62d386b" }
gpui-base = { git = "https://github.com/0xErwin1/dbflux", rev = "91192cb1966e5af4a6022094cb73b7e6b62d386b" }
gpui-component = { git = "https://github.com/0xErwin1/dbflux", rev = "91192cb1966e5af4a6022094cb73b7e6b62d386b" }
gpui-pre-linux = { git = "https://github.com/0xErwin1/dbflux", rev = "91192cb1966e5af4a6022094cb73b7e6b62d386b" }

# Line tables keep backtraces usable at a fraction of the link time and
# memory that full debug info costs with GPUI in the graph.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
