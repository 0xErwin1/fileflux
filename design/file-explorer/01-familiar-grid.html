const ICON={folder:'<path d="M3 7V5h6l2 2h10v13H3z"/>',image:'<path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><circle cx="10" cy="12" r="2"/><path d="m20 17-1.296-1.296a2.41 2.41 0 0 0-3.408 0L9 22"/>',text:'<path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>',code:'<path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 12.5 8 15l2 2.5"/><path d="m14 12.5 2 2.5-2 2.5"/>',pdf:'<path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>',audio:'<path d="M11.65 22H18a2 2 0 0 0 2-2V8a2.4 2.4 0 0 0-.706-1.706l-3.588-3.588A2.4 2.4 0 0 0 14 2H6a2 2 0 0 0-2 2v10.35"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M8 20v-7l3 1.474"/><circle cx="6" cy="20" r="2"/>',video:'<path d="M4 12V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.706.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="m10 17.843 3.033-1.755a.64.64 0 0 1 .967.56v4.704a.65.65 0 0 1-.967.56L10 20.157"/>',archive:'<path d="M13.659 22H18a2 2 0 0 0 2-2V8a2.4 2.4 0 0 0-.706-1.706l-3.588-3.588A2.4 2.4 0 0 0 14 2H6a2 2 0 0 0-2 2v11.5"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M8 12v-1"/><path d="M8 18v-2"/><path d="M8 7V6"/><circle cx="8" cy="20" r="2"/>',other:'<path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/>'};
const KIND={folder:"Folder",image:"Image",text:"Text",code:"Code",pdf:"PDF",audio:"Audio",video:"Video",archive:"Archive",other:"File"};
const WIDE=document.body.classList.contains("widepath");
const $=s=>document.querySelector(s);
const sidebar=$(".sidebar"),crumbsEl=$(".breadcrumbs"),pathInput=$("#path"),searchInput=$("#search"),sortSel=$("#sort"),entriesEl=$(".entries"),emptyEl=$(".empty"),listheadWrap=$(".listheadwrap"),headingEl=$(".heading"),countEl=$(".foldercount"),scopeEl=$(".scope"),itemCount=$("#itemcount"),statusMsg=$(".statusmessage");
const backBtn=$("#back"),fwdBtn=$("#forward"),upBtn=$("#up"),editBtn=$("#editpath"),sideToggle=$(".mobiletoggle");
const viewBtns=[...document.querySelectorAll(".viewtoggle .iconbtn")];
const navRows=[...document.querySelectorAll(".navrow")];
let view=WIDE?"list":"grid";
let path=HOME;
let hist=[HOME],hi=0;
let query="";
let note="",noteBad=false;
const selByPath=new Map();
selByPath.set(path,new Set());
let selection=selByPath.get(path);
function selSet(){let s=selByPath.get(path);if(!s){s=new Set();selByPath.set(path,s);}return s;}
function svg(kind){
if(kind==="folder"){
// Compact filled silhouette: the tab-and-body folder filled with the
// info blue, like the native tile composition — not a stroked outline.
return '<svg class="icon folderfill" viewBox="0 0 24 24" aria-hidden="true">'+ICON.folder+"</svg>";
}
return '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">'+(ICON[kind]||ICON.other)+"</svg>";
}
function human(s){if(s<1024)return s+" B";const u=["KB","MB","GB","TB"];let v=s/1024,i=0;while(v>=1024&&i<u.length-1){v/=1024;i++;}return (v>=100?String(Math.round(v)):v.toFixed(1))+" "+u[i];}
function df(m){return new Date(m+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});}
function sorted(list){const mode=sortSel.value;return list.slice().sort((a,b)=>{const fa=a.t==="folder",fb=b.t==="folder";if(fa!==fb)return fa?-1:1;if(mode==="modified")return b.m.localeCompare(a.m)||a.n.localeCompare(b.n);if(mode==="kind")return (KIND[a.t]||"").localeCompare(KIND[b.t]||"")||a.n.localeCompare(b.n);return a.n.localeCompare(b.n,undefined,{numeric:true,sensitivity:"base"});});}
function applySelection(){const sel=selByPath.get(path)||new Set();[...entriesEl.children].forEach(el=>{const on=sel.has(el.dataset.name);el.classList.toggle("selected",on);el.setAttribute("aria-selected",on?"true":"false");});}
function updateStatus(){
const total=FS[path].entries.length;
itemCount.textContent=total===1?"1 item":total+" items";
statusMsg.classList.toggle("error",noteBad);
if(note)statusMsg.textContent=note;
else if(selection.size===1)statusMsg.textContent=[...selection][0]+" selected";
else if(selection.size>1)statusMsg.textContent=selection.size+" items selected";
else statusMsg.textContent="";
}
function renderEntries(list){
entriesEl.replaceChildren();
list.forEach((e,i)=>{
const b=document.createElement("button");
b.type="button";b.className="entry"+(e.t==="folder"?" folder":"");
b.dataset.name=e.n;b.tabIndex=i===0?0:-1;
if(view==="grid"){
b.title=e.n;
b.innerHTML='<span class="entryicon">'+svg(e.t)+'</span><span class="filename"></span><span class="selectedcheck" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><path d="m4 12 5 5 11-11"/></svg></span>';
b.querySelector(".filename").textContent=e.n;
}else{
b.innerHTML='<span class="identity">'+svg(e.t)+'<span class="filename"></span></span><span class="metadata"></span><span class="metadata size"></span><span class="metadata"></span>';
b.querySelector(".filename").textContent=e.n;
const md=b.querySelectorAll(".metadata");
md[0].textContent=KIND[e.t]||"File";
md[1].textContent=e.t==="folder"?"\u2014":human(e.s);
md[2].textContent=df(e.m);
}
entriesEl.appendChild(b);
});
applySelection();
}
function addCrumb(label,p,current){
const b=document.createElement("button");
b.type="button";b.textContent=label;
if(current)b.setAttribute("aria-current","page");
b.addEventListener("click",()=>navigate(p));
crumbsEl.appendChild(b);
if(!current)crumbsEl.insertAdjacentHTML("beforeend",'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>');
}
function renderCrumbs(){
crumbsEl.replaceChildren();
if(path==="trash:"){addCrumb("Trash","trash:",true);return;}
addCrumb("System","/",path==="/");
let acc="";
path.split("/").filter(Boolean).forEach((seg,i,arr)=>{acc+="/"+seg;addCrumb(seg,acc,i===arr.length-1);});
}
function render(){
const folder=FS[path];
const total=folder.entries.length;
const filtered=query?folder.entries.filter(e=>e.n.toLowerCase().includes(query)):folder.entries;
const list=sorted(filtered);
headingEl.textContent=folder.name;
document.title=folder.name+" — Fileflux";
if(document.activeElement!==pathInput)pathInput.value=path;
countEl.textContent=total===1?"1 item":total+" items";
entriesEl.className="entries "+view;
viewBtns.forEach(b=>b.setAttribute("aria-pressed",b.dataset.view===view?"true":"false"));
renderCrumbs();
renderEntries(list);
let kind=null;
if(total===0)kind="empty";else if(list.length===0)kind="noresult";
emptyEl.hidden=!kind;
listheadWrap.hidden=view!=="list"||!!kind;
entriesEl.hidden=!!kind;
if(kind==="empty"){
emptyEl.replaceChildren();
const h=document.createElement("strong");h.textContent="This folder is empty";
const p=document.createElement("p");p.textContent=folder.trash?"Trash is empty. Deleted items would appear here.":"Favorites can point to an empty folder. Nothing to show yet.";
emptyEl.append(h,p);
}else if(kind==="noresult"){
emptyEl.replaceChildren();
const h=document.createElement("strong");h.textContent="No matches for “"+searchInput.value.trim()+"”";
const p=document.createElement("p");p.textContent="Search checks names in "+path+" only, not its subfolders.";
const btn=document.createElement("button");btn.type="button";btn.textContent="Clear search";
btn.addEventListener("click",()=>{searchInput.value="";query="";render();searchInput.focus();});
emptyEl.append(h,p,btn);
}
if(folder.trash&&!query)scopeEl.textContent=folder.note;
else if(folder.trash&&query)scopeEl.textContent=folder.note+" Filtering "+list.length+" of "+total+" in this folder.";
else if(query)scopeEl.textContent="Filtering “"+searchInput.value.trim()+"” — "+list.length+" of "+total+" items in "+path+". Current folder only, no subfolders.";
else scopeEl.textContent="";
navRows.forEach(r=>r.classList.toggle("active",r.dataset.path===path));
backBtn.disabled=hi<=0;
fwdBtn.disabled=hi>=hist.length-1;
upBtn.disabled=path==="/"||path==="trash:";
updateStatus();
}
function navigate(p,push=true){
if(!FS[p])return false;
note="";noteBad=false;pathInput.removeAttribute("aria-invalid");
if(!selByPath.has(p))selByPath.set(p,new Set());
path=p;selection=selByPath.get(p);
query="";searchInput.value="";
if(push){hist=hist.slice(0,hi+1);hist.push(p);hi=hist.length-1;}
if(sidebar.classList.contains("open")){sidebar.classList.remove("open");sideToggle.setAttribute("aria-expanded","false");}
render();
return true;
}
function open(name,viaKeyboard){
const e=FS[path].entries.find(x=>x.n===name);
if(!e)return;
if(e.t!=="folder"){
note="Preview only — “"+name+"” would open in its default app. The prototype does not access the operating system.";noteBad=false;
updateStatus();return;
}
const child=(path==="/"?"":path)+"/"+name;
if(navigate(child)){if(viaKeyboard){const f=entriesEl.querySelector(".entry");if(f)f.focus();}}
else{note="No such folder in this preview: "+child;noteBad=true;updateStatus();}
}
function startEdit(){
if(!WIDE){crumbsEl.hidden=true;pathInput.hidden=false;}
pathInput.value=path;pathInput.focus();pathInput.select();
}
function endEdit(){
pathInput.value=path;pathInput.removeAttribute("aria-invalid");
if(noteBad){note="";noteBad=false;}
if(!WIDE){pathInput.hidden=true;crumbsEl.hidden=false;}else pathInput.blur();
updateStatus();
}
navRows.forEach(r=>r.addEventListener("click",()=>navigate(r.dataset.path)));
backBtn.addEventListener("click",()=>{if(hi>0){hi--;navigate(hist[hi],false);}});
fwdBtn.addEventListener("click",()=>{if(hi<hist.length-1){hi++;navigate(hist[hi],false);}});
upBtn.addEventListener("click",()=>{if(path==="/"||path==="trash:")return;navigate(path.slice(0,path.lastIndexOf("/"))||"/");});
editBtn.addEventListener("click",()=>{document.activeElement===pathInput?endEdit():startEdit();});
pathInput.addEventListener("keydown",ev=>{
if(ev.key==="Enter"){ev.preventDefault();
const v=pathInput.value.trim();
if(!v)return;
if(v===path){endEdit();return;}
if(navigate(v))endEdit();
else{note="No such folder in this preview: "+v+" — known places are in the sidebar.";noteBad=true;pathInput.setAttribute("aria-invalid","true");updateStatus();}
}else if(ev.key==="Escape"){ev.preventDefault();endEdit();}
});
pathInput.addEventListener("input",()=>{if(noteBad){note="";noteBad=false;pathInput.removeAttribute("aria-invalid");updateStatus();}});
searchInput.addEventListener("input",()=>{query=searchInput.value.trim().toLowerCase();note="";noteBad=false;render();});
searchInput.addEventListener("keydown",ev=>{if(ev.key==="Escape"){ev.preventDefault();searchInput.value="";query="";render();searchInput.blur();}});
sortSel.addEventListener("change",render);
viewBtns.forEach(b=>b.addEventListener("click",()=>{if(view!==b.dataset.view){view=b.dataset.view;render();}}));
entriesEl.addEventListener("click",ev=>{
const b=ev.target.closest(".entry");if(!b)return;
if(ev.detail===0){open(b.dataset.name,true);return;}
const sel=selSet();
if(ev.ctrlKey||ev.metaKey){if(sel.has(b.dataset.name))sel.delete(b.dataset.name);else sel.add(b.dataset.name);}
else{sel.clear();sel.add(b.dataset.name);}
note="";noteBad=false;
applySelection();updateStatus();
});
entriesEl.addEventListener("dblclick",ev=>{const b=ev.target.closest(".entry");if(b)open(b.dataset.name,false);});
entriesEl.addEventListener("keydown",ev=>{
const els=[...entriesEl.querySelectorAll(".entry")];if(!els.length)return;
const i=els.indexOf(document.activeElement);
const k=ev.key;
if(k==="ArrowRight"||k==="ArrowLeft"){ev.preventDefault();if(i<0)els[0].focus();else{const j=k==="ArrowRight"?i+1:i-1;if(j>=0&&j<els.length)els[j].focus();}}
else if(k==="ArrowDown"||k==="ArrowUp"){ev.preventDefault();if(i<0){els[0].focus();return;}const dir=k==="ArrowDown"?1:-1;const x=els[i].offsetLeft,y=els[i].offsetTop;let best=-1,bd=Infinity;els.forEach((el,j)=>{const ey=el.offsetTop;if(j!==i&&(dir>0?ey>y:ey<y)){const d=Math.abs(el.offsetLeft-x)+Math.abs(ey-y)*8;if(d<bd){bd=d;best=j;}}});if(best>=0)els[best].focus();else els[dir>0?els.length-1:0].focus();}
else if(k==="Home"){ev.preventDefault();els[0].focus();}
else if(k==="End"){ev.preventDefault();els[els.length-1].focus();}
else if(k==="Escape"){const sel=selSet();sel.clear();applySelection();updateStatus();}
});
document.addEventListener("keydown",ev=>{
const mod=ev.ctrlKey||ev.metaKey;
if(mod&&ev.key.toLowerCase()==="l"){ev.preventDefault();startEdit();}
else if(mod&&ev.key.toLowerCase()==="f"){ev.preventDefault();searchInput.focus();searchInput.select();}
});
sideToggle.addEventListener("click",()=>{const openNow=sidebar.classList.toggle("open");sideToggle.setAttribute("aria-expanded",openNow?"true":"false");});
render();
})();
</script></body></html>
