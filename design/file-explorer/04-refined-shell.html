<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fileflux · Refined shell</title><style>
:root{--desk:#050507;--background:#09090B;--panel:#100F13;--raised:#1A181E;--line:#232128;--line-2:#37333D;--divider:#18161B;--strong:#F7F4F7;--foreground:#C6C3CC;--muted:#8E8996;--info:#6EA8FF;--success:#7BE0A0;--warning:#FFC23D;--danger:#FF6B5E;--tint:#9DB1FF;--accent:#2B45B8;--on-accent:#FFFFFF;--selection:rgba(157,177,255,.12);--hover:rgba(255,255,255,.04);--edge:rgba(255,255,255,.05);--ui:system-ui,-apple-system,"Segoe UI",sans-serif;--mono:ui-monospace,"SFMono-Regular",Consolas,monospace;--sidebar:248px;--inspector:300px}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{height:100%;margin:0}body{background:var(--desk);color:var(--foreground);font:500 13px var(--ui)}
button,input{font:inherit;color:inherit;border:0;border-radius:0;background:none}button{cursor:pointer}button:hover{background:var(--hover)}button:disabled{opacity:.4;cursor:default}button:disabled:hover{background:none}
:focus-visible{outline:1.5px solid var(--tint);outline-offset:-2px}
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.icon{width:16px;height:16px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}button .icon{pointer-events:none}
.cut{clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.island{background:var(--panel);border:1px solid var(--edge);clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}

.app{height:100dvh;min-height:420px;display:flex;flex-direction:column;padding-top:8px}
.middle{flex:1;min-height:0;display:flex;gap:8px;padding:0 8px}

/* Sidebar: names only, paths in tooltips, volumes carry usage */
.sidebar{width:var(--sidebar);flex-shrink:0;display:flex;flex-direction:column;overflow:auto;padding:10px 0 12px}
.app.nosidebar .sidebar{display:none}
.label{margin:14px 16px 6px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);display:flex;align-items:center}
.label .count{margin-left:auto;font:11px var(--mono);letter-spacing:0}
.navrow{position:relative;height:28px;padding:0 16px;display:flex;align-items:center;gap:10px;width:100%;text-align:left;color:var(--foreground)}
.navrow .icon{width:15px;height:15px;color:var(--muted)}
.navrow.active{background:var(--selection);color:var(--strong)}
.navrow.active:before{content:"";position:absolute;inset:0 auto 0 0;width:2px;background:var(--tint)}
.navrow.active .icon{color:var(--tint)}
.navrow .badge{margin-left:auto;font:11px var(--mono);color:var(--muted)}
.volume{height:auto;padding:6px 16px;flex-direction:column;align-items:stretch;gap:5px}
.volume .top{display:flex;align-items:center;gap:10px}
.volume .eject{margin-left:auto;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.volume .eject .icon{width:13px;height:13px}
.meter{height:3px;background:var(--raised);margin-left:25px}
.meter span{display:block;height:100%;background:var(--info)}
.meter.high span{background:var(--warning)}
.volume .free{margin-left:25px;font:11px var(--mono);color:var(--muted)}
.emptyfav{margin:2px 16px 0;padding:8px 10px;border:1px dashed var(--line-2);color:var(--muted);font-size:12px;line-height:17px}

/* Document */
.document{flex:1;min-width:0;display:flex;flex-direction:column}
.toolbar{height:50px;display:flex;align-items:center;gap:6px;padding:0 10px 0 14px;border-bottom:1px solid var(--line)}
.iconbtn{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.iconbtn:hover:not(:disabled){color:var(--foreground)}
.iconbtn[aria-pressed=true]{color:var(--tint)}
.navgroup{display:flex;gap:2px}.sep{width:1px;height:18px;background:var(--line);margin:0 4px}
.crumbs{flex:1;min-width:0;height:30px;display:flex;align-items:center;gap:0;padding:0 4px;background:var(--background);border:1px solid var(--line);overflow:hidden;cursor:text}
.crumbs:hover{border-color:var(--line-2)}
.crumbs button{height:22px;padding:0 7px;color:var(--muted);white-space:nowrap;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.crumbs button:hover{color:var(--foreground)}
.crumbs button.current{color:var(--strong)}
.crumbs .chev{width:12px;height:12px;color:var(--line-2)}
.crumbs .root .icon{width:14px;height:14px}
.pathedit{flex:1;min-width:0;height:30px;padding:0 10px;background:var(--background);border:1px solid var(--line-2);outline:1.5px solid var(--tint);font:12px var(--mono);color:var(--strong)}
.search{width:220px;height:30px;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--background);border:1px solid var(--line)}
.search:focus-within{border-color:var(--line-2);outline:1.5px solid var(--tint)}
.search .icon{width:14px;height:14px;color:var(--muted)}
.search input{flex:1;min-width:0;outline:none;font-size:12px}
.search input::placeholder{color:var(--muted)}
.search kbd{font:11px var(--mono);color:var(--muted);border:1px solid var(--line);padding:0 4px}
.segment{display:flex;padding:2px;gap:2px;background:var(--background);border:1px solid var(--line)}
.segment button{width:28px;height:24px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.segment button[aria-pressed=true]{background:var(--raised);color:var(--tint)}
.segment .icon{width:15px;height:15px}

.subbar{height:44px;display:flex;align-items:center;gap:10px;padding:0 20px;flex-shrink:0}
.subbar h1{margin:0;font-size:16px;font-weight:700;color:var(--strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subbar .meta{font:12px var(--mono);color:var(--muted);white-space:nowrap}
.subbar .grow{flex:1}
.chip{height:26px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;border:1px solid var(--line)}
.chip:hover{color:var(--foreground)}
.chip .icon{width:13px;height:13px}
.chip.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chip.primary:hover{background:var(--accent);filter:brightness(1.12)}

.body{flex:1;min-height:0;display:flex}
.entries{flex:1;min-width:0;overflow:auto;outline:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px;align-content:start;padding:4px 16px 24px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 6px 10px;min-height:118px;text-align:center;color:var(--foreground);border:1px solid transparent}
.tile:hover{background:var(--hover)}
.tile.selected{background:var(--selection);border-color:rgba(157,177,255,.35);color:var(--strong)}
.tile:focus-visible{outline:1.5px solid var(--tint);outline-offset:-1px}
.thumb{width:64px;height:52px;display:flex;align-items:center;justify-content:center}
.thumb svg{display:block}
.photo{width:62px;height:46px;border:1px solid var(--line-2);background:var(--raised);overflow:hidden}
.tile .name{font-size:13px;line-height:17px;max-width:100%;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .sub{font:11px var(--mono);color:var(--muted);margin-top:-4px}
.tile.cutpending{opacity:.45}
.tile .renamer{width:100%;font-size:13px;padding:2px 4px;background:var(--background);outline:1.5px solid var(--tint);color:var(--strong);text-align:center}

.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{position:sticky;top:0;z-index:1;background:var(--panel);height:34px;padding:0 12px;text-align:left;font-weight:600;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
.table th:hover{color:var(--foreground)}
.table th.sorted{color:var(--strong)}
.table th .arrow{display:inline-block;margin-left:6px;color:var(--tint)}
.table th.num,.table td.num{text-align:right}
.table td{height:32px;padding:0 12px;white-space:nowrap}
.table tr.row{cursor:default}
.table tr.row:hover td{background:var(--hover)}
.table tr.row.selected td{background:var(--selection);color:var(--strong)}
.table tr.row.selected td:first-child{box-shadow:inset 2px 0 var(--tint)}
.table .ident{display:flex;align-items:center;gap:10px;min-width:0}
.table .ident span{overflow:hidden;text-overflow:ellipsis}
.table td.meta{font:12px var(--mono);color:var(--muted)}
.table td:first-child{width:100%;max-width:0}

/* Inspector: the preview direction */
.inspector{width:var(--inspector);flex-shrink:0;border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:auto}
.inspector .preview{margin:16px;height:180px;display:flex;align-items:center;justify-content:center;background:var(--background);border:1px solid var(--line)}
.inspector h2{margin:0 16px;font-size:14px;font-weight:700;color:var(--strong);overflow-wrap:anywhere}
.inspector .kind{margin:4px 16px 0;color:var(--muted);font-size:12px}
.inspector dl{margin:16px;display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:12px}
.inspector dt{color:var(--muted)}
.inspector dd{margin:0;font-family:var(--mono);color:var(--foreground);text-align:right;overflow-wrap:anywhere}
.inspector .actions{margin:auto 16px 16px;display:flex;gap:6px;flex-wrap:wrap}
.inspector .none{margin:auto;padding:24px;text-align:center;color:var(--muted);font-size:12px;line-height:18px}
.app.noinspector .inspector{display:none}

.statusbar{height:38px;flex-shrink:0;display:flex;align-items:center;gap:14px;padding:0 16px;font-size:12px;color:var(--muted)}
.statusbar strong{color:var(--foreground);font-weight:600}
.statusbar .right{margin-left:auto;display:flex;align-items:center;gap:14px}
.statusbar .dot{width:6px;height:6px;background:var(--success);display:inline-block;margin-right:6px}
.statusbar button{display:inline-flex;align-items:center;gap:6px;color:var(--muted);padding:2px 6px}
.statusbar kbd{font:11px var(--mono);border:1px solid var(--line);padding:0 4px;color:var(--foreground)}

.menu{position:fixed;z-index:10;min-width:220px;padding:4px;background:var(--raised);border:1px solid var(--line-2)}
.menu button{width:100%;height:28px;padding:0 10px;display:flex;align-items:center;gap:10px;text-align:left}
.menu button .icon{width:14px;height:14px;color:var(--muted)}
.menu button kbd{margin-left:auto;font:11px var(--mono);color:var(--muted)}
.menu button.danger,.menu button.danger .icon{color:var(--danger)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.toast{position:fixed;z-index:11;right:24px;bottom:52px;padding:10px 14px;background:var(--raised);border:1px solid var(--line-2);border-left:2px solid var(--tint);color:var(--strong);font-size:12px;display:flex;gap:12px;align-items:center}
.toast button{color:var(--tint);font-weight:600;padding:2px 4px}

@media(max-width:1180px){.app{--inspector:260px}.search{width:170px}}
@media(max-width:900px){.inspector{display:none}.search kbd{display:none}}
@media(max-width:720px){
  .sidebar{position:fixed;z-index:5;left:8px;top:8px;bottom:46px;width:min(280px,calc(100% - 16px));display:none;border:1px solid var(--line-2)}
  .app.mobilenav .sidebar{display:flex}
  .app.nosidebar .sidebar{display:none}
  .toolbar{height:auto;flex-wrap:wrap;padding:8px;row-gap:8px}
  .crumbs{order:5;flex-basis:100%}
  .search{flex:1;width:auto}
  .navgroup,.sep,#inspectorBtn{display:none}
  .subbar{padding:0 12px}.subbar .meta{display:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));padding:4px 8px 16px}
  .statusbar .hint{display:none}
  .table th:nth-child(3),.table td:nth-child(3){display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head>

<div class="app" id="app">
  <div class="middle">
    <nav class="sidebar island" aria-label="Places">
      <div class="label">Places</div>
      <div id="places"></div>
      <div class="label">Favorites <span class="count" id="favcount"></span></div>

      <div class="label">Devices</div>

    <main class="document island" aria-label="Folder">
      <div class="toolbar" role="toolbar" aria-label="Navigation">
        <button class="iconbtn cut mobile-only" id="sidebarBtn" title="Toggle sidebar (Ctrl+B)" aria-label="Toggle sidebar"><svg class="icon"><use href="#i-sidebar"/></svg></button>
        <span class="navgroup">
          <button class="iconbtn cut" id="backBtn" title="Back (Alt+←)" aria-label="Back"><svg class="icon"><use href="#i-left"/></svg></button>
          <button class="iconbtn cut" id="fwdBtn" title="Forward (Alt+→)" aria-label="Forward"><svg class="icon"><use href="#i-right"/></svg></button>
          <button class="iconbtn cut" id="upBtn" title="Parent folder (Alt+↑)" aria-label="Parent folder"><svg class="icon"><use href="#i-up"/></svg></button>
        </span>
        <span class="sep"></span>
        <div class="crumbs cut" id="crumbs" title="Click empty space or press Ctrl+L to type a path"></div>

        <label class="search cut"><svg class="icon"><use href="#i-search"/></svg><input id="search" placeholder="Filter this folder" aria-label="Filter this folder"><kbd>Ctrl F</kbd></label>
        <div class="segment cut" role="group" aria-label="View">
          <button id="gridBtn" aria-pressed="true" title="Grid (Ctrl+1)" aria-label="Grid view"><svg class="icon"><use href="#i-grid"/></svg></button>
          <button id="listBtn" aria-pressed="false" title="Details (Ctrl+2)" aria-label="Details view"><svg class="icon"><use href="#i-list"/></svg></button>

<script>
const H = '/home/ignacio';
const now = new Date('2026-11-18T10:30:00');
const d = (days, h=12) => new Date(now - days*864e5 - h*36e5 % 864e5);
const folder = (name, items, days) => ({name, kind:'folder', items, mod:d(days)});
const file = (name, size, days, type) => ({name, kind:'file', size, mod:d(days), type});

const FS = {

  [H+'/Pictures']: [folder('Screenshots',214,0), folder('Wallpapers',36,22), folder('Rio 2025',412,190), folder('Scans',17,64), file('IMG_4821.jpg',4.2e6,1,'image'), file('IMG_4822.jpg',3.9e6,1,'image'), file('cerro-catedral.jpg',6.1e6,9,'image'), file('avatar.png',184e3,120,'image'), file('family-dinner.heic',2.7e6,33,'image'), file('timelapse.mp4',318e6,48,'video'), file('edits.xcf',22e6,48,'file')],
  [H+'/Pictures/Screenshots']: [file('Screenshot 2026-11-18 09-41.png',420e3,0,'image'), file('Screenshot 2026-11-17 22-10.png',612e3,0,'image'), file('Screenshot 2026-11-16 18-02.png',380e3,2,'image')],
  [H+'/Pictures/Wallpapers']: [file('nebula-4k.png',12.4e6,22,'image'), file('patagonia.jpg',8.1e6,60,'image')],
  [H+'/Pictures/Rio 2025']: [folder('Day 1',88,190), folder('Day 2',102,189), file('ipanema.jpg',5.2e6,190,'image')],
  [H+'/Pictures/Scans']: [file('passport.pdf',1.1e6,64,'text'), file('lease-2026.pdf',2.3e6,300,'text')],
  [H+'/Documents']: [folder('Invoices',41,4), folder('Talks',7,80), file('resume.pdf',212e3,15,'text'), file('budget.ods',48e3,2,'file')],
  [H+'/Downloads']: [file('nixos-25.11.iso',2.6e9,0,'archive'), file('gpui-notes.pdf',3.1e6,1,'text')],
};
const PLACES = [['Home',H,'i-home'],['Desktop',H+'/Desktop','i-desktop'],['Documents',H+'/Documents','i-doc'],['Downloads',H+'/Downloads','i-download'],['Music',H+'/Music','i-music'],['Pictures',H+'/Pictures','i-image'],['Videos',H+'/Videos','i-video'],['Trash','trash:///','i-trash']];
const VOLUMES = [{name:'System',path:'/',icon:'i-drive',used:.62,free:'188 GB free of 498 GB'},{name:'data',path:'/mnt/data',icon:'i-drive',used:.91,free:'84 GB free of 931 GB'},{name:'KINGSTON',path:'/run/media/ignacio/KINGSTON',icon:'i-usb',used:.38,free:'19.8 GB free of 32 GB',removable:true}];
const state = {path:H+'/Pictures', back:[H], fwd:[], view:'grid', sel:new Set(['IMG_4821.jpg']), anchor:'IMG_4821.jpg', query:'', sort:['name',1], favs:[H+'/Projects'], cut:new Set(), renaming:null};
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const icon = (id, cls='icon') => `<svg class="${cls}"><use href="#${id}"/></svg>`;
const fmtSize = b => b==null?'':b<1e3?b+' B':b<1e6?(b/1e3).toFixed(0)+' KB':b<1e9?(b/1e6).toFixed(1)+' MB':(b/1e9).toFixed(2)+' GB';
function fmtDate(t){const days=Math.floor((now-t)/864e5);if(days<1)return 'Today, '+t.toTimeString().slice(0,5);if(days<2)return 'Yesterday';if(days<7)return days+' days ago';return t.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:t.getFullYear()===now.getFullYear()?undefined:'numeric'});}
const label = p => p===H?'Home':p.split('/').pop();
const listing = () => FS[state.path] || [];

function folderArt(size=52){
  const w=size*1.18,h=size;
  return `<svg width="${w}" height="${h}" viewBox="0 0 59 50" aria-hidden="true"><path d="M2 6h20l5 5h30v35H2z" fill="var(--info)" opacity=".55"/><path d="M2 15h55v31H2z" fill="var(--info)"/><path d="M2 15h55v3H2z" fill="var(--strong)" opacity=".18"/></svg>`;
}
const hue = name => [...name].reduce((a,c)=>a+c.charCodeAt(0),0);
function photoArt(name){
  const k=hue(name)%4, tones=[['var(--info)','var(--accent)'],['var(--warning)','var(--danger)'],['var(--success)','var(--info)'],['var(--tint)','var(--accent)']][k];
  return `<div class="photo"><svg width="62" height="46" viewBox="0 0 62 46" aria-hidden="true"><rect width="62" height="46" fill="${tones[1]}" opacity=".45"/><circle cx="${14+k*8}" cy="13" r="6" fill="${tones[0]}" opacity=".9"/><path d="M0 46 20 24l12 12 10-8 20 18z" fill="var(--panel)" opacity=".85"/></svg></div>`;
}
function glyph(e, size=40){
  if(e.kind==='folder') return folderArt(size*1.3);
  if(e.type==='image') return photoArt(e.name);
  const id={video:'i-video',archive:'i-archive',text:'i-doc'}[e.type]||'i-file';
  return `<svg class="icon" style="width:${size}px;height:${size}px;stroke-width:1.4;color:var(--muted)"><use href="#${id}"/></svg>`;
}
function smallGlyph(e){
  if(e.kind==='folder') return `<svg width="16" height="14" viewBox="0 0 59 50" aria-hidden="true"><path d="M2 6h20l5 5h30v35H2z" fill="var(--info)" opacity=".55"/><path d="M2 15h55v31H2z" fill="var(--info)"/></svg>`;
  const id={image:'i-image',video:'i-video',archive:'i-archive',text:'i-doc'}[e.type]||'i-file';
  return `<svg class="icon" style="color:var(--muted)"><use href="#${id}"/></svg>`;
}

function visible(){
  const q=state.query.toLowerCase();
  const [key,dir]=state.sort;
  return listing().filter(e=>e.name.toLowerCase().includes(q)).sort((a,b)=>{
    if(a.kind!==b.kind) return a.kind==='folder'?-1:1;
    const va=key==='size'?(a.size??a.items??0):key==='mod'?+a.mod:a.name.toLowerCase();
    const vb=key==='size'?(b.size??b.items??0):key==='mod'?+b.mod:b.name.toLowerCase();
    return (va<vb?-1:va>vb?1:0)*dir;
  });
}

function renderSidebar(){
  $('places').innerHTML = PLACES.map(([n,p,i])=>`<button class="navrow ${p===state.path?'active':''}" data-go="${esc(p)}" title="${esc(p)}">${icon(i)}<span>${n}</span>${n==='Trash'?'<span class="badge">3</span>':''}</button>`).join('');
  $('favcount').textContent = state.favs.length || '';
  $('favorites').innerHTML = state.favs.length ? state.favs.map(p=>`<button class="navrow ${p===state.path?'active':''}" data-go="${esc(p)}" title="${esc(p)}">${icon('i-star')}<span>${esc(label(p))}</span></button>`).join('') : '<div class="emptyfav">Star a folder to pin it here.</div>';
  $('volumes').innerHTML = VOLUMES.map(v=>`<button class="navrow volume ${v.path===state.path?'active':''}" data-go="${esc(v.path)}" title="${esc(v.path)}"><span class="top">${icon(v.icon)}<span>${v.name}</span>${v.removable?`<span class="eject" role="button" aria-label="Eject ${v.name}" title="Eject" data-eject="${v.name}">${icon('i-eject')}</span>`:''}</span><span class="meter ${v.used>.85?'high':''}"><span style="width:${v.used*100}%"></span></span><span class="free">${v.free}</span></button>`).join('');
}

function renderToolbar(){
  const parts = state.path.split('/').filter(Boolean);
  let acc='';
  const items = parts.map((p,i)=>{acc+='/'+p;return {name:p,path:acc};});
  const homeIdx = items.findIndex(x=>x.path===H);
  const shown = homeIdx>=0 ? [{name:'Home',path:H,home:true}, ...items.slice(homeIdx+1)] : [{name:'/',path:'/'}, ...items];
  $('crumbs').innerHTML = shown.map((c,i)=>`${i?icon('i-chev','icon chev'):''}<button class="${i===shown.length-1?'current':''} ${c.home?'root':''}" data-go="${esc(c.path)}">${c.home?icon('i-home'):''}${esc(c.name)}</button>`).join('');
  $('backBtn').disabled=!state.back.length; $('fwdBtn').disabled=!state.fwd.length; $('upBtn').disabled=state.path==='/';
  $('gridBtn').setAttribute('aria-pressed',state.view==='grid'); $('listBtn').setAttribute('aria-pressed',state.view==='list');
  const fav=state.favs.includes(state.path);
  $('favBtn').querySelector('span').textContent = fav?'In favorites':'Add to favorites';
  $('favBtn').style.color = fav?'var(--warning)':'';
  $('title').textContent = label(state.path);
  const l=listing(), nf=l.filter(e=>e.kind==='folder').length;
  $('meta').textContent = `${nf} folders · ${l.length-nf} files`;
}

function renderEntries(){
  const rows=visible(), el=$('entries');
  if(!rows.length){el.innerHTML=`<div class="none" style="padding:96px 24px;text-align:center;color:var(--muted)">${state.query?`No names match “${esc(state.query)}”.`:'This folder is empty. Right-click to create something.'}</div>`;return;}
  if(state.view==='grid'){
    el.innerHTML=`<div class="grid">${rows.map(e=>{
      const sel=state.sel.has(e.name);
      const name = state.renaming===e.name ? `<input class="renamer" id="renamer" value="${esc(e.name)}" aria-label="New name">` : `<span class="name">${esc(e.name)}</span>`;
      return `<div class="tile ${sel?'selected':''} ${state.cut.has(e.name)?'cutpending':''}" tabindex="-1" data-name="${esc(e.name)}" title="${esc(e.name)}"><span class="thumb">${glyph(e)}</span>${name}<span class="sub">${e.kind==='folder'?e.items+' items':fmtSize(e.size)}</span></div>`;}).join('')}</div>`;
  } else {
    const [k,dir]=state.sort, arrow=c=>k===c?`<span class="arrow">${dir>0?'↑':'↓'}</span>`:'';
    el.innerHTML=`<table class="table"><thead><tr><th data-sort="name" class="${k==='name'?'sorted':''}">Name${arrow('name')}</th><th data-sort="size" class="num ${k==='size'?'sorted':''}">Size${arrow('size')}</th><th data-sort="mod" class="${k==='mod'?'sorted':''}">Modified${arrow('mod')}</th></tr></thead><tbody>${rows.map(e=>`<tr class="row ${state.sel.has(e.name)?'selected':''} ${state.cut.has(e.name)?'cutpending':''}" data-name="${esc(e.name)}"><td><span class="ident">${smallGlyph(e)}<span>${esc(e.name)}</span></span></td><td class="num meta">${e.kind==='folder'?e.items+' items':fmtSize(e.size)}</td><td class="meta">${fmtDate(e.mod)}</td></tr>`).join('')}</tbody></table>`;
  }
  const r=$('renamer'); if(r){r.focus(); const dot=r.value.lastIndexOf('.'); r.setSelectionRange(0, dot>0?dot:r.value.length);}
}

function renderInspector(){
  const sel=[...state.sel].map(n=>listing().find(e=>e.name===n)).filter(Boolean), el=$('inspector');
  if(!sel.length){const l=listing();el.innerHTML=`<div class="preview">${folderArt(70)}</div><h2>${esc(label(state.path))}</h2><div class="kind">Folder</div><dl><dt>Items</dt><dd>${l.length}</dd><dt>Location</dt><dd>${esc(state.path)}</dd></dl><div class="none">Select an item to preview it.</div>`;return;}
  if(sel.length>1){const total=sel.reduce((a,e)=>a+(e.size||0),0);el.innerHTML=`<div class="preview"><span style="font:600 28px var(--mono);color:var(--strong)">${sel.length}</span></div><h2>${sel.length} items selected</h2><div class="kind">${fmtSize(total)} in files</div><div class="actions"><button class="chip cut">${icon('i-copy')}Copy</button><button class="chip cut">${icon('i-scissors')}Move</button><button class="chip cut" style="color:var(--danger)">${icon('i-trash')}Move to Trash</button></div>`;return;}
  const e=sel[0];
  const big = e.kind==='folder'?folderArt(80):e.type==='image'?`<div style="transform:scale(3.2)">${photoArt(e.name)}</div>`:glyph(e,64);
  const kind = e.kind==='folder'?'Folder':({image:'Image',video:'Video',archive:'Archive',text:'Document'}[e.type]||'File')+' · '+e.name.split('.').pop().toUpperCase();
  el.innerHTML=`<div class="preview">${big}</div><h2>${esc(e.name)}</h2><div class="kind">${kind}</div><dl>${e.kind==='folder'?`<dt>Items</dt><dd>${e.items}</dd>`:`<dt>Size</dt><dd>${fmtSize(e.size)}</dd>`}${e.type==='image'?'<dt>Dimensions</dt><dd>4032 × 3024</dd>':''}<dt>Modified</dt><dd>${fmtDate(e.mod)}</dd><dt>Permissions</dt><dd>rw-r--r--</dd><dt>Path</dt><dd>${esc(state.path+'/'+e.name)}</dd></dl><div class="actions"><button class="chip cut primary">${icon('i-open')}Open</button><button class="chip cut" data-act="rename">${icon('i-pencil')}Rename</button><button class="chip cut" data-act="trash" style="color:var(--danger)">${icon('i-trash')}Trash</button></div>`;
}

function renderStatus(){
  const sel=[...state.sel].map(n=>listing().find(e=>e.name===n)).filter(Boolean);
  const total=sel.reduce((a,e)=>a+(e.size||0),0);
  $('status').innerHTML = sel.length ? `<strong>${sel.length} selected</strong> · ${fmtSize(total)||'folders only'}` : `${visible().length} items`;
  const vol = VOLUMES.find(v=>state.path.startsWith(v.path)&&v.path!=='/') || VOLUMES[0];
  $('volstatus').innerHTML = `<span class="dot"></span>${vol.free.replace(' of',' on '+vol.name+' of')}`;
}
function render(){renderSidebar();renderToolbar();renderEntries();renderInspector();renderStatus();}

function go(path, push=true){
  if(path==='trash:///'){toast('Trash opens its own view with Restore and Empty actions.');return;}
  if(path===state.path)return;
  if(push){state.back.push(state.path);state.fwd=[];}
  state.path=path;state.sel.clear();state.query='';$('search').value='';state.renaming=null;
  if(!FS[path])FS[path]=[];
  render();
}
let toastTimer;
function toast(msg, undo){const t=$('toast');t.innerHTML=esc(msg)+(undo?'<button id="undoBtn">Undo</button>':'');t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,4000);if(undo)$('undoBtn').onclick=()=>{undo();t.hidden=true;render();};}

function trashSelected(){
  const names=[...state.sel]; if(!names.length)return;
  const removed=listing().filter(e=>state.sel.has(e.name));
  FS[state.path]=listing().filter(e=>!state.sel.has(e.name));
  state.sel.clear(); render();
  toast(`Moved ${names.length===1?'“'+names[0]+'”':names.length+' items'} to Trash`, ()=>{FS[state.path]=FS[state.path].concat(removed);});
}
function newFolder(){
  let n='Untitled folder',i=2;while(listing().some(e=>e.name===n))n='Untitled folder '+i++;
  FS[state.path]=listing().concat(folder(n,0,0));state.sel=new Set([n]);state.renaming=n;render();
}
function commitRename(value){
  const old=state.renaming; state.renaming=null; const v=value.trim();
  if(v && v!==old){ if(listing().some(e=>e.name===v)){toast(`“${v}” already exists here`);render();return;} const e=listing().find(x=>x.name===old); e.name=v; state.sel=new Set([v]); }
  render();
}

function openMenu(x,y,target){
  const m=$('menu'), has=state.sel.size>0;
  const item=(id,ic,label,kbd,cls='')=>`<button role="menuitem" data-act="${id}" class="${cls}">${icon(ic)}${label}${kbd?`<kbd>${kbd}</kbd>`:''}</button>`;
  m.innerHTML = has ? item('open','i-open','Open','Enter')+item('openwith','i-open','Open with…')+'<hr>'+item('copy','i-copy','Copy','Ctrl C')+item('cut','i-scissors','Cut','Ctrl X')+item('rename','i-pencil','Rename','F2')+item('copypath','i-link','Copy path','Ctrl ⇧ C')+'<hr>'+item('info','i-info','Properties','Alt ↵')+item('trash','i-trash','Move to Trash','Del','danger')
    : item('newfolder','i-folderplus','New folder','Ctrl ⇧ N')+item('newfile','i-file','New file')+item('paste','i-copy','Paste','Ctrl V')+'<hr>'+item('terminal','i-terminal','Open terminal here')+item('copypath','i-link','Copy folder path');
  m.hidden=false; const r=m.getBoundingClientRect();
  m.style.left=Math.min(x,innerWidth-r.width-8)+'px'; m.style.top=Math.min(y,innerHeight-r.height-8)+'px';
  m.querySelector('button').focus();
}
function act(a){
  $('menu').hidden=true;
  ({trash:trashSelected,newfolder:newFolder,
    rename:()=>{if(state.sel.size===1){state.renaming=[...state.sel][0];render();}},
    cut:()=>{state.cut=new Set(state.sel);render();toast(`${state.cut.size} item(s) ready to move — paste in another folder`);},
    copy:()=>toast(`${state.sel.size} item(s) copied`),
    paste:()=>toast(state.cut.size?'Moving… progress appears in the status bar':'Nothing to paste'),
    copypath:()=>toast('Path copied'),
  }[a]||(()=>toast('Design preview: “'+a+'” is proposed, not wired.')))();
}

document.addEventListener('click',ev=>{
  const g=ev.target.closest('[data-go]'), ej=ev.target.closest('[data-eject]');
  if(ej){ev.stopPropagation();toast(`${ej.dataset.eject} can be removed safely`);return;}
  if(g){go(g.dataset.go);return;}
  if(!ev.target.closest('#menu'))$('menu').hidden=true;
  const a=ev.target.closest('[data-act]'); if(a){act(a.dataset.act);return;}
  const s=ev.target.closest('th[data-sort]'); if(s){const k=s.dataset.sort;state.sort=[k,state.sort[0]===k?-state.sort[1]:1];renderEntries();return;}
  const it=ev.target.closest('[data-name]');
  if(it && !ev.target.closest('#renamer')){
    const n=it.dataset.name;
    if(ev.ctrlKey||ev.metaKey){state.sel.has(n)?state.sel.delete(n):state.sel.add(n);state.anchor=n;}
    else if(ev.shiftKey&&state.anchor){const names=visible().map(e=>e.name),a=names.indexOf(state.anchor),b=names.indexOf(n);state.sel=new Set(names.slice(Math.min(a,b),Math.max(a,b)+1));}
    else{state.sel=new Set([n]);state.anchor=n;}
    renderEntries();renderInspector();renderStatus();return;
  }
  if(ev.target.closest('#entries')&&!it){state.sel.clear();renderEntries();renderInspector();renderStatus();}
});
document.addEventListener('dblclick',ev=>{const it=ev.target.closest('[data-name]');if(!it)return;const e=listing().find(x=>x.name===it.dataset.name);if(e&&e.kind==='folder')go(state.path+'/'+e.name);else if(e)toast(`Opens “${e.name}” with the default application`);});
document.addEventListener('contextmenu',ev=>{if(!ev.target.closest('#entries'))return;ev.preventDefault();const it=ev.target.closest('[data-name]');if(it&&!state.sel.has(it.dataset.name)){state.sel=new Set([it.dataset.name]);renderEntries();renderInspector();renderStatus();}if(!it){state.sel.clear();renderEntries();renderInspector();renderStatus();}openMenu(ev.clientX,ev.clientY);});
document.addEventListener('focusout',ev=>{if(ev.target.id==='renamer')commitRename(ev.target.value);});
document.addEventListener('keydown',ev=>{
  if(ev.target.id==='renamer'){if(ev.key==='Enter')ev.target.blur();if(ev.key==='Escape'){state.renaming=null;render();}return;}
  if(ev.target.id==='pathedit'){if(ev.key==='Escape')closePath();if(ev.key==='Enter'){const v=ev.target.value.replace(/^~/,H).replace(/\/$/,'');closePath();go(v||'/');}return;}
  if(ev.key==='Escape'){$('menu').hidden=true;}
  if(ev.target.tagName==='INPUT')return;
  const mod=ev.ctrlKey||ev.metaKey;
  if(ev.key==='F2'){ev.preventDefault();act('rename');}
  else if(ev.key==='Delete'){act('trash');}
  else if(mod&&ev.key.toLowerCase()==='l'){ev.preventDefault();openPath();}
  else if(mod&&ev.key.toLowerCase()==='f'){ev.preventDefault();$('search').focus();}
  else if(mod&&ev.key==='1'){ev.preventDefault();state.view='grid';render();}
  else if(mod&&ev.key==='2'){ev.preventDefault();state.view='list';render();}
  else if(mod&&ev.key.toLowerCase()==='i'){ev.preventDefault();$('inspectorBtn').click();}
  else if(mod&&ev.key.toLowerCase()==='b'){ev.preventDefault();$('sidebarBtn').click();}
  else if(mod&&ev.shiftKey&&ev.key.toLowerCase()==='n'){ev.preventDefault();newFolder();}
  else if(mod&&ev.key.toLowerCase()==='a'){ev.preventDefault();state.sel=new Set(visible().map(e=>e.name));renderEntries();renderInspector();renderStatus();}
  else if(ev.altKey&&ev.key==='ArrowLeft')$('backBtn').click();
  else if(ev.altKey&&ev.key==='ArrowRight')$('fwdBtn').click();
  else if(ev.altKey&&ev.key==='ArrowUp')$('upBtn').click();
});
function openPath(){$('crumbs').hidden=true;const p=$('pathedit');p.hidden=false;p.value=state.path.replace(H,'~');p.focus();p.select();}
function closePath(){$('crumbs').hidden=false;$('pathedit').hidden=true;}
$('pathedit').addEventListener('blur',closePath);
$('crumbs').addEventListener('click',ev=>{if(ev.target===$('crumbs'))openPath();});
$('search').addEventListener('input',ev=>{state.query=ev.target.value;renderEntries();renderStatus();});
$('gridBtn').onclick=()=>{state.view='grid';render();};
$('listBtn').onclick=()=>{state.view='list';render();};
$('backBtn').onclick=()=>{if(!state.back.length)return;state.fwd.push(state.path);go(state.back.pop(),false);};
$('fwdBtn').onclick=()=>{if(!state.fwd.length)return;state.back.push(state.path);go(state.fwd.pop(),false);};
$('upBtn').onclick=()=>go(state.path.replace(/\/[^/]+$/,'')||'/');
$('inspectorBtn').onclick=ev=>{const app=$('app');app.classList.toggle('noinspector');$('inspectorBtn').setAttribute('aria-pressed',!app.classList.contains('noinspector'));};
$('sidebarBtn').onclick=()=>{const app=$('app');if(innerWidth<=720){app.classList.toggle('mobilenav');app.classList.remove('nosidebar');}else app.classList.toggle('nosidebar');};
$('favBtn').onclick=()=>{const i=state.favs.indexOf(state.path);i>=0?state.favs.splice(i,1):state.favs.push(state.path);render();};
$('newBtn').onclick=newFolder;
$('moreBtn').onclick=ev=>{const r=ev.currentTarget.getBoundingClientRect();state.sel.clear();renderEntries();renderInspector();openMenu(r.left-180,r.bottom+4);};
render();
</script>
</body></html>
